[package]
name = "rennari"
version = "0.1.0"
edition = "2024"
description = "Rust client and server for the Rennari protocol"
license = "MIT"
repository = "https://github.com/thomas666-beast/rennari-rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
axum = { version = "0.7", features = ["ws"] }
regex = "1"
rand = "0.8"
hex = "0.4"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "app"
path = "examples/app.rs"

[[example]]
name = "client"
path = "examples/client.rs"
